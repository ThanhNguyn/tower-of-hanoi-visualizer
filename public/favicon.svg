<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <!-- Metallic Rod Gradient -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Base Plinth Gradient -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3546"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>

    <!-- Disk 1 (Amber Gold) -->
    <linearGradient id="disk1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Disk 2 (Terracotta) -->
    <linearGradient id="disk2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Disk 3 (Crimson) -->
    <linearGradient id="disk3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Solid Milled Base Plinth -->
  <rect x="7" y="47" width="50" height="7" rx="2.5" fill="url(#baseGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.75"/>
  <line x1="8" y1="47.5" x2="56" y2="47.5" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.75"/>

  <!-- 3 Stainless Metallic Rods -->
  <!-- Peg A -->
  <rect x="16.5" y="16" width="3" height="31" rx="1.5" fill="url(#rodGrad)"/>
  <!-- Peg B -->
  <rect x="30.5" y="16" width="3" height="31" rx="1.5" fill="url(#rodGrad)"/>
  <!-- Peg C -->
  <rect x="44.5" y="16" width="3" height="31" rx="1.5" fill="url(#rodGrad)"/>

  <!-- Stacked Stepped Disks on Peg A -->
  <!-- Disk 3 (Bottom) -->
  <rect x="8" y="41" width="20" height="5.5" rx="2" fill="url(#disk3Grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.6"/>
  <line x1="9" y1="41.5" x2="27" y2="41.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.6"/>

  <!-- Disk 2 (Middle) -->
  <rect x="10.5" y="34.5" width="15" height="5.5" rx="2" fill="url(#disk2Grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.6"/>
  <line x1="11.5" y1="35" x2="24.5" y2="35" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.6"/>

  <!-- Disk 1 (Top) -->
  <rect x="13" y="28" width="10" height="5.5" rx="1.8" fill="url(#disk1Grad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.6"/>
  <line x1="14" y1="28.5" x2="22" y2="28.5" stroke="rgba(255, 255, 255, 0.5)" stroke-width="0.6"/>

  <!-- Dynamic Motion Arc (Subtle trajectory to Peg C) -->
  <path d="M 18 25 C 26 12, 38 12, 46 22" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round"/>
</svg>
